[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voyagegraph-mcp"
version = "1.0.0"
description = "An MCP-powered agentic AI travel planner built with LangGraph, Groq, and Streamlit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ansh Madanpuriya" }]
dependencies = [
  "fastmcp>=4.0.5,<5",
  "langchain-core>=1.6.3,<2",
  "langchain-groq>=1.1.3,<2",
  "langgraph>=1.2.11,<2",
  "python-dotenv>=1.2.3,<2",
  "requests>=2.34.2,<3",
  "streamlit>=1.64.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
